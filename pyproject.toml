# uv workspace root. Members are added as packages are created.
[tool.uv.workspace]
members = ["core/backend"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["core/backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["siloless", "tests"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["core/backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["core/backend/tests"]
