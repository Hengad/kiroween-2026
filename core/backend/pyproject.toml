[project]
name = "siloless"
version = "0.1.0"
description = "Siloless engine: permission-aware organizational memory, tracking and accountability."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siloless"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
